<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Конфигуратор каркаса — 3D демо</title>
<style>
:root{--ink:#232837;--gold:#c8af87;--line:#e7e1d6;--paper:#f4f1ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1f2a;color:var(--ink);font:15px/1.4 system-ui,sans-serif}
body{display:grid;grid-template-rows:auto 1fr}
header{display:flex;justify-content:space-between;gap:16px;align-items:end;padding:16px 22px;color:#f4f1ea}
header small{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:11px}
header h1{margin:4px 0 0;font-weight:560;font-size:26px}
.stage{position:relative;min-height:560px}
canvas{display:block;width:100%;height:100%}
.panel{position:absolute;top:16px;left:16px;width:280px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
label{display:block;margin:10px 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6d675e}
select,button{width:100%;height:40px;border-radius:999px;border:1px solid var(--ink);background:#fff;padding:0 12px;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{margin-top:12px;background:var(--gold);border-color:var(--gold);cursor:pointer}
.card{position:absolute;right:16px;bottom:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:260px}
.card b{font-size:18px}
.price{color:#8a7044;font-weight:700;font-size:18px}
.hint{margin:8px 0 0;color:#6d675e;font-size:13px}
.badge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a7044}
@media(max-width:800px){.panel{position:static;width:auto;margin:12px}.card{position:static;margin:12px}}
</style>
</head>
<body>
<header>
<div><small>Демо · 3D каркас · только по ссылке</small><h1>Собрать каркас</h1></div>
<div>Крутите мышью · колёсико приближает</div>
</header>
<div class="stage">
<div class="panel">
<label>Установка</label>
<select id="mount"><option value="FC">Распорный</option><option value="W">Настенный</option><option value="F">Напольный</option><option value="FW">Напольно-настенный</option></select>
<label>Доступ</label>
<select id="access"><option value="IT">Откидной</option><option value="PO" selected>Полный выдвиг</option></select>
<div class="row"><div><label>Столбцы</label><select id="cols"></select></div><div><label>Ряды</label><select id="rows"></select></div></div>
<button id="send">Отправить инженеру</button>
</div>
<canvas id="c"></canvas>
<div class="card"><div class="badge">Артикул</div><b id="sku">TEGAR WMS-FC-PO-2x2</b><div class="badge" style="margin-top:8px">Цена от</div><div class="price" id="price">156 000 руб.</div><p class="hint" id="hint">Макет из узлов. Это не чертёж DWG.</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const PRICE={'FC|IT|2x2':83000,'FC|IT|2x4':173000,'FC|IT|3x4':265500,'FC|IT|4x2':175500,'FC|IT|4x3':266500,'FC|PO|2x2':156000,'FC|PO|2x4':317000,'FC|PO|3x4':482500,'FC|PO|4x2':320500,'FC|PO|4x3':484000,'W|IT|2x2':43500,'W|IT|4x2':86500,'W|IT|4x3':130000,'W|PO|2x2':116500,'W|PO|3x4':350500,'W|PO|4x2':234000,'W|PO|4x3':350500,'F|IT|2x2':83000,'F|PO|2x2':156000,'FW|IT|2x3':127500,'FW|IT|3x3':197000,'FW|PO|2x2':156000,'FW|PO|2x3':236500};
const cols=document.getElementById('cols'), rows=document.getElementById('rows');
for(let i=2;i<=4;i++){cols.add(new Option(i,i));rows.add(new Option(i,i));}
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe7e2d8); scene.fog=new THREE.Fog(0xe7e2d8,12,28);
const camera=new THREE.PerspectiveCamera(40,1,0.1,80); camera.position.set(6.2,3.4,7.4);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true;
const controls=new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.target.set(0,1.2,0); controls.maxPolarAngle=Math.PI*0.49;
scene.add(new THREE.AmbientLight(0xffffff,0.55));
const sun=new THREE.DirectionalLight(0xfff6ea,0.95); sun.position.set(6,10,4); sun.castShadow=true; scene.add(sun);
scene.add(new THREE.DirectionalLight(0xc8af87,0.25).translateX(-4));
const floor=new THREE.Mesh(new THREE.CircleGeometry(8,48), new THREE.MeshStandardMaterial({color:0xf7f4ee,roughness:0.9}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(10,6), new THREE.MeshStandardMaterial({color:0xddd6cb,roughness:1}));
wall.position.set(0,2.2,-0.85); wall.receiveShadow=true; scene.add(wall);
const frame=new THREE.Group(); scene.add(frame);
const steel=new THREE.MeshStandardMaterial({color:0x2a2f3a,metalness:0.55,roughness:0.38});
const screen=new THREE.MeshStandardMaterial({color:0x141820,metalness:0.15,roughness:0.55});
const joint=new THREE.MeshStandardMaterial({color:0xc8af87,metalness:0.45,roughness:0.35});
function add(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; frame.add(m); return m;}
function build(){
 while(frame.children.length) frame.remove(frame.children[0]);
 const c=+cols.value, r=+rows.value, mount=document.getElementById('mount').value, acc=document.getElementById('access').value;
 const pw=1.22, ph=0.72, gap=0.045, depth=acc==='PO'?0.42:0.12;
 const W=c*pw+(c-1)*gap, H=r*ph+(r-1)*gap, y0=0.35;
 wall.visible=mount!=='F';
 for(let i=0;i<=c;i++) add(0.055,H+0.18,0.07,steel,-W/2+i*(pw+gap)-pw/2,y0+H/2,0);
 for(let j=0;j<=r;j++) add(W+0.16,0.048,0.07,steel,0,y0+j*(ph+gap),0);
 for(let j=0;j<r;j++) for(let i=0;i<c;i++){
  const x=-W/2+i*(pw+gap), y=y0+j*(ph+gap)+ph/2;
  add(0.035,0.035,depth,joint,x-pw*0.32,y-ph*0.28,depth/2);
  add(0.035,0.035,depth,joint,x+pw*0.32,y-ph*0.28,depth/2);
  add(0.035,0.035,depth,joint,x-pw*0.32,y+ph*0.28,depth/2);
  add(0.035,0.035,depth,joint,x+pw*0.32,y+ph*0.28,depth/2);
  const p=add(pw-0.07,ph-0.07,0.035,screen,x,y,depth+0.02);
  if(acc==='IT') p.rotation.x=-0.08;
 }
 if(mount==='F'||mount==='FW') add(W+0.7,0.07,0.62,steel,0,0.08,0.12);
 if(mount==='FC'){ add(0.07,H+1.1,0.07,steel,-W/2-0.22,y0+H/2,0); add(0.07,H+1.1,0.07,steel,W/2+0.22,y0+H/2,0); }
 const key=mount+'|'+acc+'|'+c+'x'+r, price=PRICE[key];
 document.getElementById('sku').textContent=price?('TEGAR WMS-'+mount+'-'+acc+'-'+c+'x'+r):'Нет в таблице';
 document.getElementById('price').textContent=price?('от '+price.toLocaleString('ru-RU')+' руб.'):'Заявка инженеру';
 document.getElementById('hint').textContent=price?'3D-макет собран из стоек, ригелей и модулей. Цена черновик.':'Этой матрицы нет в таблице. Цену не показываем.';
}
function fit(){const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/Math.max(h,1); camera.updateProjectionMatrix();}
function loop(){requestAnimationFrame(loop); controls.update(); fit(); renderer.render(scene,camera);} 
['mount','access','cols','rows'].forEach(id=>document.getElementById(id).onchange=build);
document.getElementById('send').onclick=()=>alert('Демо. Заявка ушла бы с полями: '+document.getElementById('sku').textContent);
build(); loop();
</script>
</body></html>

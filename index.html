<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Демо конфигуратора — Аллегри</title>
<style>
:root { --ink:#232837; --gold:#c8af87; --line:#e7e1d6; --paper:#f7f4ee; }
* { box-sizing:border-box; }
body { margin:0; font:16px/1.45 Georgia, 'Times New Roman', serif; background:var(--paper); color:var(--ink); }
header { background:var(--ink); color:#f4f1ea; padding:22px 28px; }
header small { letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font:600 11px/1 system-ui, sans-serif; }
header h1 { margin:6px 0 0; font-size:28px; font-weight:500; }
header p { margin:6px 0 0; max-width:640px; color:#d9d3c7; }
.wrap { display:grid; grid-template-columns: 320px 1fr; gap:18px; padding:18px; max-width:1180px; margin:0 auto; }
.sheet, .stage { background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 30px rgba(35,40,55,.06); }
.sheet { padding:18px; }
label { display:block; margin:12px 0 6px; font:600 12px/1 system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:#6d675e; }
select, button { width:100%; height:42px; border-radius:999px; border:1px solid var(--ink); background:#fff; color:var(--ink); font:600 14px/1 system-ui, sans-serif; padding:0 14px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
button.gold { margin-top:16px; background:var(--gold); border-color:var(--gold); color:var(--ink); cursor:pointer; }
button.gold:disabled { opacity:.45; cursor:default; }
.note { margin-top:12px; font:13px/1.4 system-ui, sans-serif; color:#6d675e; }
.stage { min-height:520px; position:relative; overflow:hidden; }
canvas { width:100%; height:520px; display:block; background:linear-gradient(#fbfaf7,#ece7df); }
.out { position:absolute; left:16px; right:16px; bottom:16px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; justify-content:space-between; gap:12px; align-items:center; }
.out b { font-size:18px; }
.price { color:#8a7044; font:600 18px/1 system-ui, sans-serif; }
.badge { font:600 11px/1 system-ui, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:#8a7044; }
@media (max-width:860px) { .wrap { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
<small>Демо · не в меню · только по ссылке</small>
<h1>Собрать каркас</h1>
<p>Макет из узлов, не чертёж. Цена «от» с витрины, если строки нет — заявка инженеру без цены.</p>
</header>
<div class="wrap">
<aside class="sheet">
<label>Установка</label>
<select id="mount">
<option value="FC">Распорный</option>
<option value="W">Настенный</option>
<option value="F">Напольный</option>
<option value="FW">Напольно-настенный</option>
</select>
<label>Доступ</label>
<select id="access">
<option value="IT">Откидной</option>
<option value="PO" selected>Полный выдвиг push-out</option>
</select>
<div class="row">
<div><label>Столбцы</label><select id="cols"></select></div>
<div><label>Ряды</label><select id="rows"></select></div>
</div>
<label>Диагональ</label>
<select id="diag"><option>46–55</option><option>55–65</option></select>
<button class="gold" id="send">Отправить инженеру</button>
<p class="note" id="hint">Цена черновик. Доставка, монтаж и панель не входят.</p>
</aside>
<section class="stage">
<canvas id="c"></canvas>
<div class="out">
<div><div class="badge">Артикул</div><b id="sku">TEGAR WMS-FC-PO-2x2</b></div>
<div><div class="badge">Цена от</div><div class="price" id="price">156 000 руб.</div></div>
</div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const PRICE = {
'FC|IT|2x2':83000,'FC|IT|2x4':173000,'FC|IT|3x4':265500,'FC|IT|4x2':175500,'FC|IT|4x3':266500,
'FC|PO|2x2':156000,'FC|PO|2x4':317000,'FC|PO|3x4':482500,'FC|PO|4x2':320500,'FC|PO|4x3':484000,
'W|IT|2x2':43500,'W|IT|4x2':86500,'W|IT|4x3':130000,
'W|PO|2x2':116500,'W|PO|3x4':350500,'W|PO|4x2':234000,'W|PO|4x3':350500,
'F|IT|2x2':83000,'F|PO|2x2':156000,
'FW|IT|2x3':127500,'FW|IT|3x3':197000,'FW|PO|2x2':156000,'FW|PO|2x3':236500
};
const cols = document.getElementById('cols'), rows = document.getElementById('rows');
for (let i=2;i<=4;i++){ cols.add(new Option(i,i)); rows.add(new Option(i,i)); }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(4.2, 2.4, 6.2);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(4,8,6); scene.add(sun);
const group = new THREE.Group(); scene.add(group);
const steel = new THREE.MeshStandardMaterial({color:0x2b303b, metalness:0.35, roughness:0.45});
const panel = new THREE.MeshStandardMaterial({color:0x111318, metalness:0.1, roughness:0.7});
const gold = new THREE.MeshStandardMaterial({color:0xc8af87, metalness:0.4, roughness:0.4});
function box(w,h,d,mat,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); group.add(m); }
function build(){
while(group.children.length) group.remove(group.children[0]);
const c=+cols.value, r=+rows.value, mount=document.getElementById('mount').value, acc=document.getElementById('access').value;
const pw=1.15, ph=0.68, gap=0.06;
const W=c*pw+(c-1)*gap, H=r*ph+(r-1)*gap;
for(let x=0;x<=c;x++) box(0.05,H+0.2,0.05,steel, -W/2+x*(pw+gap)-pw/2, H/2, 0);
for(let y=0;y<=r;y++) box(W+0.2,0.045,0.05,steel, 0, y*(ph+gap), 0);
for(let y=0;y<r;y++) for(let x=0;x<c;x++){
const px=-W/2+x*(pw+gap), py=y*(ph+gap)+ph/2;
box(pw-0.08, ph-0.08, 0.04, panel, px, py, acc==='PO'?0.18:0.06);
box(0.08,0.08, acc==='PO'?0.22:0.08, gold, px, py, 0.02);
}
if(mount==='F'||mount==='FW') box(W+0.4,0.06,0.55,steel,0,-0.08,0.1);
if(mount==='FC'){ box(0.06,H+0.8,0.06,steel,-W/2-0.15,H/2,0); box(0.06,H+0.8,0.06,steel,W/2+0.15,H/2,0); }
const key=mount+'|'+acc+'|'+c+'x'+r;
const price=PRICE[key];
const sku='TEGAR WMS-'+mount+'-'+acc+'-'+c+'x'+r;
document.getElementById('sku').textContent = price? sku : 'Нет в таблице';
document.getElementById('price').textContent = price? ('от '+price.toLocaleString('ru-RU')+' руб.') : 'Заявка инженеру';
document.getElementById('hint').textContent = price? 'ID подтянется из таблицы. Цена черновик, без доставки и монтажа.' : 'Этой матрицы в таблице нет. Цену не показываем, заявка уйдёт инженеру.';
group.position.y = -H/2;
}
function fit(){
const canvas=renderer.domElement, w=canvas.clientWidth, h=canvas.clientHeight;
renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
let a=0;
function loop(){ requestAnimationFrame(loop); a+=0.004; group.rotation.y=Math.sin(a)*0.35; fit(); renderer.render(scene,camera); }
['mount','access','cols','rows','diag'].forEach(id=>document.getElementById(id).onchange=build);
document.getElementById('send').onclick=()=>{ alert('Демо. Заявка ушла бы с полями: '+document.getElementById('sku').textContent); };
build(); loop();
</script>
</body>
</html>
